# =====================================================================
# Konfigurasi database
#
# File ini ikut di dalam aplikasi. Kalau ingin mengubahnya tanpa membongkar
# aplikasi, salin file ini ke folder yang sama dengan KaspeApp.jar — isinya
# akan dipakai menggantikan yang di dalam.
#
# Bawaannya memakai H2: database ikut aplikasi, tidak perlu dipasang
# lebih dulu, dan tabelnya dibuat sendiri saat pertama kali dijalankan.
# Datanya tersimpan sebagai satu file di folder pengguna:
#   Windows : C:\Users\<nama>\kaspe\db_kaspe.mv.db
#   Linux   : /home/<nama>/kaspe/db_kaspe.mv.db
#
# Untuk mencadangkan data, pakai tombol "Cadangkan Database" di halaman
# Transaksi (baris tombol daftar pengiriman tersimpan): hasilnya satu berkas
# .zip bertanggal, dan isinya tetap utuh walau aplikasi sedang dipakai.
#
# Menyalin file itu sendiri juga bisa, TETAPI aplikasinya harus ditutup dulu:
# selama aplikasi terbuka file itu sedang ditulis, sehingga salinannya bisa
# setengah jadi dan tidak bisa dibuka.
# =====================================================================

db.driver=org.h2.Driver
db.url=jdbc:h2:${user.home}/kaspe/db_kaspe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.user=sa
db.password=

# ---------------------------------------------------------------------
# Memakai MySQL / MariaDB (misalnya untuk dipakai beberapa komputer)
#
# Komentari pengaturan di atas, lalu pakai yang di bawah ini.
# Isi db.password dengan password MySQL kamu.
#
# Database dan tabelnya dibuat sendiri oleh aplikasi, jadi tidak perlu
# menjalankan skrip apa pun lebih dulu. Cukup nyalakan servernya.
# ---------------------------------------------------------------------
